name: lab6

on: push

jobs: 
    build-and-test:
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - name: code
              uses: actions/checkout@v4
            - name: build
              run: | 
                cmake -S . -B build
                cmake --build build
            - name: test
              run: ctest --test-dir build
