name: lab6

on: [ push , pull_request ]

jobs: 
    build-and-test:
        strategy:
            fail-fast: true
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - name: code
              uses: actions/checkout@v4

            - name: cashe
              uses: actions/cache@v4
              with:
                path: ./build
                key: ${{ matrix.os }}-build-${{ hashFiles('**/CMakeLists.txt', '**/*.cpp', '**/*.h', '**/*.hpp') }}
                restore-keys: |
                    ${{ matrix.os }}-build-

            - name: build
              run: | 
                cmake -S . -B build
                cmake --build build

            - name: upload app
              if: success()
              uses: actions/upload-artifact@v4
              with:
                name: dataconv-${{ matrix.os }}
                path: |
                    build/dataconv
                    build/*/dataconv
                    build/*/dataconv.exe
                if-no-files-found: ignore

            - name: test
              shell: bash
              run: ctest --test-dir build --output-on-failure 2>&1 | tee test.log

            - name: upload log
              if: always()
              uses: actions/upload-artifact@v4
              with:
                name: test-log-${{ matrix.os }}
                path: test.log

