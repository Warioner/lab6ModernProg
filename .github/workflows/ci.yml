name: lab6

on: push

jobs: 
    build-and-test:
        strategy:
            fail-fast: true
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - name: code
              uses: actions/checkout@v4

            - name: cache
              uses: actions/cache@v4
              with:
                path: ./build
                key: ${{ matrix.os }}-build-${{ hashFiles('**/CMakeLists.txt', '**/*.cpp', '**/*.h', '**/*.hpp') }}
                restore-keys: |
                    ${{ matrix.os }}-build-

            - name: build
              run: | 
                cmake -S . -B build
                cmake --build build

            - name: test
              run:  ctest --test-dir build -C Release --output-on-failure

