name: lab6

on: push

jobs: 
    build-and-test:
        runs-on: ubuntu-latest
        steps:
            - name: code
              uses: actions/checkout@v4
            - name: build
              run: | 
                mkdir build 
                cd build 
                cmake .. 
                cmake --build .
            - name: test
              run: ./build/dataconv_tests
